<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Praktyk - Pełny Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🎓 System Rozliczania Praktyk</span>
        </div>
    </nav>

    <div class="container">
        <div id="alert-container"></div>

        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="students-tab" data-bs-toggle="tab" data-bs-target="#students" type="button" role="tab">👨‍🎓 Studenci</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="internships-tab" data-bs-toggle="tab" data-bs-target="#internships" type="button" role="tab">🏢 Praktyki</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="documents-tab" data-bs-toggle="tab" data-bs-target="#documents" type="button" role="tab">📄 Dokumenty</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            
            <div class="tab-pane fade show active" id="students" role="tabpanel">
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div class="card shadow-sm">
                            <div class="card-header bg-primary text-white">Dodaj studenta</div>
                            <div class="card-body">
                                <form id="student-form">
                                    <input type="text" class="form-control mb-2" id="s_imie" placeholder="Imię" required>
                                    <input type="text" class="form-control mb-2" id="s_nazwisko" placeholder="Nazwisko" required>
                                    <input type="text" class="form-control mb-2" id="s_indeks" placeholder="Nr indeksu" required>
                                    <input type="email" class="form-control mb-3" id="s_email" placeholder="E-mail" required>
                                    <button type="submit" class="btn btn-success w-100">Zapisz</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <table class="table table-hover bg-white shadow-sm">
                            <thead class="table-light"><tr><th>ID</th><th>Dane</th><th>Indeks</th><th>Email</th><th>Akcje</th></tr></thead>
                            <tbody id="students-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="internships" role="tabpanel">
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div class="card shadow-sm">
                            <div class="card-header bg-primary text-white">Dodaj praktykę</div>
                            <div class="card-body">
                                <form id="internship-form">
                                    <input type="number" class="form-control mb-2" id="p_student_id" placeholder="ID Studenta" required>
                                    <input type="text" class="form-control mb-2" id="p_firma" placeholder="Nazwa firmy" required>
                                    <input type="date" class="form-control mb-2" id="p_od" required>
                                    <input type="date" class="form-control mb-3" id="p_do" required>
                                    <button type="submit" class="btn btn-success w-100">Zapisz</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <table class="table table-hover bg-white shadow-sm">
                            <thead class="table-light"><tr><th>ID</th><th>Firma</th><th>Okres</th><th>Status</th><th>Akcje</th></tr></thead>
                            <tbody id="internships-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="documents" role="tabpanel">
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div class="card shadow-sm">
                            <div class="card-header bg-primary text-white">Prześlij dokument</div>
                            <div class="card-body">
                                <form id="document-form">
                                    <input type="number" class="form-control mb-2" id="d_praktyka_id" placeholder="ID Praktyki" required>
                                    <input type="text" class="form-control mb-2" id="d_nazwa" placeholder="Nazwa pliku (np. skan.pdf)" required>
                                    <select class="form-select mb-3" id="d_typ" required>
                                        <option value="">Wybierz typ...</option>
                                        <option value="Skierowanie">Skierowanie</option>
                                        <option value="Umowa">Umowa</option>
                                        <option value="Sprawozdanie">Sprawozdanie</option>
                                    </select>
                                    <button type="submit" class="btn btn-success w-100">Zapisz</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <table class="table table-hover bg-white shadow-sm">
                            <thead class="table-light"><tr><th>ID</th><th>ID Praktyki</th><th>Nazwa</th><th>Typ</th><th>Akcje</th></tr></thead>
                            <tbody id="documents-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
